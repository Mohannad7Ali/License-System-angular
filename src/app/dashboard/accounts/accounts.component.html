<app-confirmation-dialog
  [isVisible]="isDialogVisible()"
  title="تأكيد الحذف"
  message="هل أنت متأكد أنك تريد حذف هذا المستخدم؟ لا يمكن التراجع عن هذا الإجراء."
  (confirmed)="onDialogResult($event)"
></app-confirmation-dialog>

<app-notification />

<div class="container" dir="rtl">
  <header class="page-header">
    <h2><i class="fa fa-users-cog"></i> إدارة حسابات المستخدمين</h2>
  </header>

  <form class="filteration">
    <div class="flex-container">
      <div class="search-box">
        <i class="fa fa-search search-icon"></i>
        <input
          type="text"
          [formControl]="filter"
          placeholder="بحث سريع (باسم المستخدم، المعرف...)"
        />
      </div>
      <div class="add-btn">
        <button type="button" class="button add-user-btn" (click)="onAddUser()">
          <i class="fa fa-plus-circle"></i> إضافة مستخدم جديد
        </button>
      </div>
    </div>
  </form>

  <div class="table-container card">
    <table>
      <thead>
        <tr>
          <th style="width: 10%">المعرف</th>
          <th style="width: 30%">اسم المستخدم</th>
          <th style="width: 25%">معرف الشخص</th>
          <th style="width: 15%">الحالة</th>
          <th style="width: 20%; text-align: center">الإجراءات</th>
        </tr>
      </thead>
      <tbody>
        @for (user of displayedData; track user.id) {
          <tr>
            <td class="bold-text">{{ user.id }}</td>
            <td>
              <div class="user-info-cell">
                <i class="fa fa-user-circle user-avatar-icon"></i>
                <span>{{ user.username }}</span>
              </div>
            </td>
            <td>
              <span class="badge-id">{{ user.personID }}</span>
            </td>
            <td>
              <span
                [class.active-status]="user.isActive"
                [class.inactive-status]="!user.isActive"
              >
                <span class="status-dot"></span>
                {{ user.isActive ? "نشط" : "غير نشط" }}
              </span>
            </td>
            <td>
              <div class="actions-wrapper">
                <button
                  type="button"
                  class="btn-action edit-btn"
                  (click)="onEditUser(user.id)"
                >
                  <i class="fa fa-edit"></i> تعديل
                </button>
                <button
                  type="button"
                  class="btn-action delete-btn"
                  (click)="onDelete(user.id)"
                >
                  <i class="fa fa-trash"></i> حذف
                </button>
              </div>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="5" class="empty-state">
              <i class="fa fa-folder-open empty-icon"></i>
              <p>لم يتم العثور على أي مستخدمين مسجلين</p>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>

  <div class="pagination">
    <button
      type="button"
      class="p-btn"
      (click)="onPrevious()"
      [disabled]="currentPage === 1"
    >
      <i class="fa fa-chevron-right"></i> السابق
    </button>
    <span class="page-info"
      >الصفحة <b>{{ currentPage }}</b></span
    >
    <button
      type="button"
      class="p-btn"
      (click)="onNext()"
      [disabled]="currentPage * pageSize >= filteredUsers.length"
    >
      التالي <i class="fa fa-chevron-left"></i>
    </button>
  </div>
</div>
