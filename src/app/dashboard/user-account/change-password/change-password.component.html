<app-dialog-wrapper title="تغيير كلمة مرور الحساب">
  <div class="cp-container" dir="rtl">
    <div class="cp-header">
      <i class="fa fa-shield cp-icon"></i>
      <p>يرجى إدخال كلمة المرور الحالية ثم تعيين كلمة مرور جديدة قوية.</p>
    </div>

    <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" class="cp-form">
      <!-- كلمة المرور القديمة -->
      <div class="cp-field">
        <label for="oldPassword">كلمة المرور الحالية</label>
        <div class="cp-input-group">
          <i class="fa fa-lock"></i>
          <input
            type="password"
            id="oldPassword"
            formControlName="oldPassword"
            placeholder="********"
          />
        </div>
      </div>

      <hr class="cp-divider" />

      <!-- كلمة المرور الجديدة -->
      <div class="cp-field">
        <label for="newPassword">كلمة المرور الجديدة</label>
        <div class="cp-input-group">
          <i class="fa fa-key"></i>
          <input
            type="password"
            id="newPassword"
            formControlName="newPassword"
            placeholder="5 رموز على الأقل"
          />
        </div>
      </div>

      <!-- تأكيد كلمة المرور -->
      <div class="cp-field">
        <label for="confirmPassword">تأكيد كلمة المرور الجديدة</label>
        <div class="cp-input-group">
          <i class="fa fa-check-circle-o"></i>
          <input
            type="password"
            id="confirmPassword"
            formControlName="confirmPassword"
            placeholder="أعيدي كتابة كلمة المرور"
          />
        </div>

        @if (
          passwordForm.hasError("mismatch") &&
          passwordForm.get("confirmPassword")?.touched
        ) {
          <p class="cp-error-text">كلمات المرور غير متطابقة!</p>
        }
      </div>

      <!-- الأزرار -->
      <div class="cp-actions">
        <button type="button" class="cp-btn-cancel" (click)="onCancel()">
          إلغاء
        </button>
        <button
          type="submit"
          class="cp-btn-submit"
          [disabled]="passwordForm.invalid || isSubmitting()"
        >
          {{ isSubmitting() ? "جاري الحفظ..." : "تحديث كلمة المرور" }}
        </button>
      </div>
    </form>
  </div>
</app-dialog-wrapper>
