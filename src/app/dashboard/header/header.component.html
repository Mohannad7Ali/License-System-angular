<header class="hd-main" dir="rtl">
  <!-- اليمين: زر الموبايل والعنوان الرسمي -->
  <div class="hd-right-section">
    <button
      class="hd-mobile-btn"
      (click)="toggleMobileMenu()"
      aria-label="القائمة"
    >
      <i class="fa fa-bars"></i>
    </button>

    <div class="hd-brand">
      <span class="hd-gov-title">نظام إدارة التراخيص المركزية</span>
      <span class="hd-sub-title">الجمهورية العربية السورية</span>
    </div>
  </div>

  <!-- اليسار: الإشعارات، ملف المستخدم، وتسجيل الخروج -->
  <div class="hd-left-section">
    <!-- الإشعارات -->
    <button class="hd-icon-btn" aria-label="الإشعارات">
      <i class="fa fa-bell-o"></i>
      @if (notificationCount() > 0) {
        <span class="hd-badge">{{ notificationCount() }}</span>
      }
    </button>

    <div class="hd-divider"></div>

    <!-- ملف المستخدم -->
    <button routerLink="./user-account" class="hd-user-profile">
      <div class="hd-user-info">
        <span class="hd-username">{{
          currentUserService.getCurrentUser()?.username
        }}</span>
        <span class="hd-role">مسؤول نظام</span>
      </div>
      <img src="images/user (4).png" alt="User Avatar" class="hd-avatar" />
    </button>

    <!-- زر تسجيل الخروج -->
    <button
      class="hd-logout-btn"
      (click)="showLogoutConfirm()"
      title="تسجيل الخروج"
    >
      <i class="fa fa-sign-out"></i>
      <span class="hd-logout-text">خروج</span>
    </button>
  </div>
</header>

<!-- حوار تأكيد الخروج -->
<app-confirmation-dialog
  [isVisible]="isLogoutDialogVisible()"
  title="تأكيد الخروج"
  message="هل أنت متأكد من رغبتك في تسجيل الخروج من النظام؟"
  (confirmed)="onLogoutResult($event)"
></app-confirmation-dialog>
