<div class="dashboard" dir="rtl">
  <!-- خلفية ضبابية معتمة للموبايل -->
  <div #overlayElement class="mobile-overlay" (click)="closeMobileMenu()"></div>

  <!-- الشريط الجانبي -->
  <app-sidebar #sidebarElement />

  <!-- منطقة المحتوى الرئيسية -->
  <div class="main-content">
    <app-header (mobileMenuToggle)="toggleMobileMenu()" />
    <app-notification></app-notification>

    <!-- حاوية الصفحة لتطبيق البادينغ والمساحات بمرونة -->
    <main class="page-wrapper">
      <router-outlet />
    </main>
  </div>
</div>
