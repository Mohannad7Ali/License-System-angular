<app-notification />
<app-confirmation-dialog
  [isVisible]="isDialogVisible()"
  title="تأكيد تقديم الطلب"
  message="هل أنت متأكد من البيانات وتريد تقديم طلب الرخصة المحلية الرسمي؟"
  (confirmed)="onDialogResult($event)"
></app-confirmation-dialog>

<div class="la-container" dir="rtl">
  <div class="la-card">
    <header class="la-header">
      <div class="la-header-title">
        <i class="fa fa-id-card-o main-icon"></i>
        <div>
          <h2>تقديم طلب رخصة قيادة جديدة</h2>
          <p>وزارة النقل - نظام إدارة التراخيص</p>
        </div>
      </div>
    </header>

    <div class="la-tabs">
      <button
        [class.active]="activeTab() === 'existing'"
        (click)="setTab('existing')"
      >
        <i class="fa fa-search"></i> شخص مسجل مسبقاً
      </button>
      <button [class.active]="activeTab() === 'new'" (click)="setTab('new')">
        <i class="fa fa-user-plus"></i> تسجيل شخص جديد
      </button>
    </div>

    <div class="la-tab-content">
      @if (activeTab() === "existing") {
        <div class="tab-pane animated fadeIn">
          <div class="la-search-box">
            <label>الرقم الوطني للمتقدم:</label>
            <div class="la-input-group">
              <input
                type="text"
                [formControl]="existingSearchControl"
                placeholder="أدخل الرقم الوطني..."
              />
              <button (click)="onSearch()" [disabled]="isSearching()">
                <i
                  class="fa"
                  [class.fa-search]="!isSearching()"
                  [class.fa-spinner]="isSearching()"
                  [class.fa-spin]="isSearching()"
                ></i>
                بحث
              </button>
            </div>
          </div>

          @if (foundPerson()) {
            <div class="la-person-summary">
              <div class="summary-item">
                <label>الاسم الكامل:</label>
                <span
                  >{{ foundPerson()?.firstName }}
                  {{ foundPerson()?.lastName }}</span
                >
              </div>
              <div class="summary-item">
                <label>رقم الهاتف:</label>
                <span>{{ foundPerson()?.phoneNumber }}</span>
              </div>
              <div class="summary-status">
                <i class="fa fa-check-circle"></i> تم التحقق من هوية الشخص
              </div>
            </div>
          }
        </div>
      }

      @if (activeTab() === "new") {
        <form [formGroup]="newPersonForm" class="tab-pane animated fadeIn">
          <div class="la-form-grid">
            <div class="la-field">
              <label>الاسم الأول</label>
              <input type="text" formControlName="firstName" />
            </div>
            <div class="la-field">
              <label>الكنية</label>
              <input type="text" formControlName="lastName" />
            </div>
            <div class="la-field">
              <label>الرقم الوطني</label>
              <input type="text" formControlName="nationalNo" />
            </div>
            <div class="la-field">
              <label>تاريخ الميلاد</label>
              <input type="date" formControlName="birthDate" />
            </div>
            <div class="la-field">
              <label>رقم الهاتف</label>
              <input
                type="tel"
                formControlName="phone"
                placeholder="09xxxxxxxx"
              />
            </div>
            <div class="la-field">
              <label>البريد الإلكتروني</label>
              <input type="email" formControlName="email" />
            </div>
            <div class="la-field la-full">
              <label>العنوان السكني الحالي</label>
              <input type="text" formControlName="address" />
            </div>
          </div>
        </form>
      }

      <hr class="la-divider" />

      <div class="la-common-section">
        <div class="la-field">
          <label class="important-label">فئة الرخصة المطلوبة *</label>
          <select [formControl]="licenseClassControl" class="la-select-gold">
            <option value="">-- اختر الفئة المطلوبة --</option>
            @for (lc of licenseClasses; track lc.id) {
              <option [value]="lc.id">{{ lc.className }}</option>
            }
          </select>
        </div>
      </div>

      <footer class="la-footer">
        <button class="btn-back" (click)="onCancel()">إلغاء</button>
        <button
          class="btn-submit"
          (click)="onSubmit()"
          [disabled]="isSubmitting()"
        >
          <i class="fa fa-save"></i>
          {{ isSubmitting() ? "جاري المعالجة..." : "تأكيد وحفظ الطلب" }}
        </button>
      </footer>
    </div>
  </div>
</div>
