<!-- homepage.component.html -->
<div dir="rtl" class="ov-homepage ov-fade-in-up">
  <!-- النص الرئيسي -->
  <p class="ov-main-text">قد بأمان، قد بذكاء</p>
  <p class="ov-sub-text">
    نسهل لك الحصول على رخصة القيادة بخطوات بسيطة وسريعة.
  </p>

  <!-- زر التقديم -->
  <button
    class="ov-btn ov-btn-apply"
    routerLink="../add-new-app"
    [queryParams]="{ mode: 'add', with_cancelation: true }"
    routerLinkActive="router-link-active"
  >
    <i class="fa fa-file-text-o" aria-hidden="true"></i>
    تقديم طلب رخصة
    <i class="fa fa-arrow-left" aria-hidden="true"></i>
  </button>

  <!-- بطاقات الميزات -->
  <div class="ov-cards">
    <div class="ov-card">
      <img src="images/feature1.jpg" alt="ميزة 1" />
      <div class="ov-card-overlay">
        <span>سهولة التسجيل</span>
      </div>
    </div>
    <div class="ov-card">
      <img src="images/feature2.jpg" alt="ميزة 2" />
      <div class="ov-card-overlay">
        <span>متابعة الطلب</span>
      </div>
    </div>
    <div class="ov-card">
      <img src="images/feature3.jpg" alt="ميزة 3" />
      <div class="ov-card-overlay">
        <span>اختبارات محاكاة</span>
      </div>
    </div>
    <div class="ov-card">
      <img src="images/feature4.jpg" alt="ميزة 4" />
      <div class="ov-card-overlay">
        <span>استلام الرخصة</span>
      </div>
    </div>
  </div>
</div>
