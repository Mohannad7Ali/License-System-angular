<section dir="rtl" class="landing-container" id="hero">
  <!-- عناصر الإضاءة الخلفية (Glow Orbs) -->
  <div class="glow-orb orb-primary"></div>
  <div class="glow-orb orb-secondary"></div>

  <div class="landing-content fade-in-up">
    <!-- Badge علوي -->
    <div class="hero-badge">
      <span class="badge-dot"></span>
      نظام إدارة ترخيص السواقين والمركبات (DVLD)
    </div>

    <!-- العناوين الرئيسية -->
    <h1 class="hero-title">
      قد بأمان، انطلق نحو <span class="gradient-text">المستقبل بذكاء</span>
    </h1>

    <p class="hero-subtitle">
      المنصة الرقمية الموحدة لإصدار وتجديد رخص القيادة. نسهل لك جميع الإجراءات
      والاختبارات بخطوات شفافة وسريعة.
    </p>

    <!-- أزرار التفاعل -->
    <div class="hero-actions">
      <button
        class="btn-primary-glow"
        routerLink="../add-new-app"
        [queryParams]="{ mode: 'add', with_cancelation: true }"
        routerLinkActive="router-link-active"
      >
        <i class="fa fa-file-text-o" aria-hidden="true"></i>
        <span>تقديم طلب رخصة جديد</span>
        <i class="fa fa-arrow-left arrow-icon" aria-hidden="true"></i>
      </button>

      <a href="#services" class="btn-secondary-glass">
        <i class="fa fa-compass" aria-hidden="true"></i>
        استكشف الخدمات
      </a>
    </div>

    <!-- بطاقات الميزات التفاعلية (بدلاً من الصور الثابتة) -->
    <div class="features-grid">
      <div class="feature-card glass-panel" *ngFor="let item of features">
        <div class="card-icon-wrapper">
          <i class="fa {{ item.icon }}" aria-hidden="true"></i>
        </div>
        <div class="card-info">
          <h3>{{ item.title }}</h3>
          <p>{{ item.desc }}</p>
        </div>
        <div class="card-glow-effect"></div>
      </div>
    </div>
  </div>
</section>
