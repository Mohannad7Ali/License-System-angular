<div class="homepage-container" id="contact-us" dir="rtl">
  <p class="section-title">اتصل بنا</p>
  <div class="main-text">تواصل معنا</div>
  <p class="contact-subtitle">هل أنت مستعد لإصدار رخصة قيادة؟ دعنا نساعدك!</p>

  <div class="contact-box">
    <div class="numbers">
      <p style="color: #475569; font-weight: 500; line-height: 1.8">
        يمكنك التواصل معنا عبر البريد الإلكتروني، الهاتف، أو تعبئة النموذج
        التالي.
      </p>

      <p style="color: #0f172a; font-weight: 700; font-size: 20px">
        +963-11-1234567
      </p>
      <div class="contact-hours">
        <span>🕐 ساعات العمل:</span>
        <span>الأحد - الخميس: ٩ صباحاً - ٥ مساءً</span>
      </div>
    </div>

    <form action="" class="contact-form">
      <p
        style="
          text-align: center;
          font-size: 22px;
          color: #0f172a;
          font-weight: 800;
          margin-bottom: 8px;
        "
      >
        أرسل رسالتك
      </p>
      <div class="control-row">
        <div class="control">
          <input
            type="text"
            name="first-name"
            id="first-name"
            placeholder="الاسم الأول"
            class="contact-input"
          />
        </div>
        <div class="control">
          <input
            type="text"
            name="last-name"
            id="last-name"
            placeholder="الاسم الأخير"
            class="contact-input"
          />
        </div>
      </div>
      <div class="control-row">
        <div class="control">
          <input
            type="email"
            name="email"
            id="email"
            placeholder="البريد الإلكتروني"
            class="contact-input"
          />
        </div>
      </div>
      <div class="control-row">
        <div class="control">
          <input
            type="tel"
            name="tel"
            id="tel"
            placeholder="رقم الهاتف"
            class="contact-input"
          />
        </div>
      </div>
      <div class="control-row">
        <div class="control">
          <textarea
            id="message"
            placeholder="كيف يمكننا مساعدتك؟"
            class="contact-textarea"
            rows="4"
          ></textarea>
        </div>
      </div>
      <button class="button homepage-button contact-submit">إرسال</button>
    </form>
  </div>
</div>
