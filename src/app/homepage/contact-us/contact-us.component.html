<div class="ov-contact-us ov-fade-in-up" id="contact-us" dir="rtl">
  <!-- رأس القسم -->
  <div class="ov-section-header">
    <span class="ov-section-badge">اتصل بنا</span>
    <h2 class="ov-main-text">تواصل معنا</h2>
    <p class="contact-subtitle">
      هل أنت مستعد لإصدار أو تجديد رخصة قيادتك؟ نحن هنا لمساعدتك!
    </p>
  </div>

  <div class="contact-box">
    <!-- معلومات التواصل الجانبية -->
    <div class="numbers">
      <p class="info-text">
        يمكنك التواصل معنا عبر البريد الإلكتروني، الهاتف، أو تعبئة نموذج التواصل
        المباشر.
      </p>

      <div class="phone-card">
        <i class="fa fa-phone" aria-hidden="true"></i>
        <span dir="ltr">+963-11-1234567</span>
      </div>

      <div class="contact-hours">
        <div class="hours-header">
          <i class="fa fa-clock-o" aria-hidden="true"></i>
          <span>ساعات العمل الرسمية:</span>
        </div>
        <span class="hours-details">الأحد - الخميس: ٩ صباحاً - ٥ مساءً</span>
      </div>
    </div>

    <!-- نموذج أرسل رسالتك -->
    <form class="contact-form" (submit)="$event.preventDefault()">
      <h3 class="form-title">أرسل رسالتك</h3>

      <div class="control-row">
        <div class="control">
          <input
            type="text"
            name="first-name"
            id="first-name"
            placeholder="الاسم الأول"
            class="contact-input"
          />
        </div>
        <div class="control">
          <input
            type="text"
            name="last-name"
            id="last-name"
            placeholder="الاسم الأخير"
            class="contact-input"
          />
        </div>
      </div>

      <div class="control-row">
        <div class="control">
          <input
            type="email"
            name="email"
            id="email"
            placeholder="البريد الإلكتروني"
            class="contact-input"
          />
        </div>
      </div>

      <div class="control-row">
        <div class="control">
          <input
            type="tel"
            name="tel"
            id="tel"
            placeholder="رقم الهاتف"
            class="contact-input"
          />
        </div>
      </div>

      <div class="control-row">
        <div class="control">
          <textarea
            id="message"
            placeholder="كيف يمكننا مساعدتك؟"
            class="contact-textarea"
            rows="4"
          ></textarea>
        </div>
      </div>

      <button type="submit" class="contact-submit">إرسال الرسالة</button>
    </form>
  </div>
</div>
